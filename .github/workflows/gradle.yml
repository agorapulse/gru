name: Check

on: [push, pull_request]
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -Xms4g"
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Test with Micronaut client
        run: ./gradlew check --parallel
      - name: Test with JDK Client
        env:
          GRU_HTTP_CLIENT: okhttp
        run: ./gradlew :heist-micronaut:clean check --parallel
      - name: Test with OkHttp Client
        env:
          GRU_HTTP_CLIENT: jdk
        run: ./gradlew :heist-micronaut:clean check --parallel
