name: Check

on: [push, pull_request]
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -Xms4g"
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Check
        run: ./gradlew check --parallel
        # The previous matrix steps (`:heist-micronaut:clean check` with
        # GRU_HTTP_CLIENT=okhttp / GRU_HTTP_CLIENT=jdk) re-ran heist-micronaut's
        # integration tests against different HTTP client backends. heist-
        # micronaut is currently excluded from the build (its
        # io.micronaut.application 5.0.0 plugin trips a NoSuchMethodError on
        # Java 25), and no other test consumes GRU_HTTP_CLIENT, so the extra
        # steps are dropped until heist-micronaut comes back.
