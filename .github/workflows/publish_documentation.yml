name: Manual Publish Documentation

on: workflow_dispatch

jobs:
  publish:
    name: Publish Documentation
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -Xms4g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Get Latest Release
        id: latest_version
        uses: abatilo/release-info-action@v1.3.0
        with:
          owner: agorapulse
          repo: gru
      - name: Configure git identity for gitPublishCommit
        run: |
          git config --global user.name 'Agorapulse Bot'
          git config --global user.email 'oss@agorapulse.com'
      - name: Publish GitHub Pages
        env:
          GIT_PUBLISH_USERNAME: agorapulse-bot
          GIT_PUBLISH_PASSWORD: ${{ secrets.AGORAPULSE_BOT_PERSONAL_TOKEN }}
        run: ./gradlew :guide:gitPublishPush -Pversion=${{ steps.latest_version.outputs.latest_tag }} -Prelease=true
