plugins {
    id 'lifecycle-base'
    id 'org.jetbrains.kotlin.jvm'            version "${kotlinVersion}" apply false
    id 'org.jetbrains.kotlin.kapt'           version "${kotlinVersion}" apply false
    id 'org.jetbrains.kotlin.plugin.allopen' version "${kotlinVersion}" apply false
    id 'com.vanniktech.maven.publish'        version '0.34.0'           apply false
    id 'org.ajoberstar.git-publish'          version '5.1.1'            apply false
}

if (!project.hasProperty('mavenCentralUsername'))       ext.mavenCentralUsername            = System.getenv('MAVEN_CENTRAL_USERNAME') ?: '**UNDEFINED**'
if (!project.hasProperty('mavenCentralPassword'))       ext.mavenCentralPassword            = System.getenv('MAVEN_CENTRAL_PASSWORD') ?: '**UNDEFINED**'
if (!project.hasProperty('signingInMemoryKeyId'))       ext.signingInMemoryKeyId            = System.getenv('SIGNING_KEY_ID') ?: '**UNDEFINED**'
if (!project.hasProperty('signingInMemoryKeyPassword')) ext.signingInMemoryKeyPassword      = System.getenv('SIGNING_PASSWORD') ?: '**UNDEFINED**'
if (!project.hasProperty('signingInMemoryKey'))         ext.signingInMemoryKey              = System.getenv('SIGNING_SECRET_KEY_PATH') ? rootProject.file(System.getenv('SIGNING_SECRET_KEY_PATH')).text : '**UNDEFINED**'

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url 'https://repo.grails.org/grails/core' }
        maven { url 'https://repo.spring.io/release/' }
    }
}

def isInDir = { Project p, String dirName -> p.projectDir.parentFile?.name == dirName }
def libsProjects       = subprojects.findAll { isInDir(it, 'libs') }
def examplesProjects   = subprojects.findAll { isInDir(it, 'examples') }
def kotlinLibsProjects = subprojects.findAll { isInDir(it, 'kotlin-libs') }
def platformsProjects  = subprojects.findAll { isInDir(it, 'platforms') }

configure(libsProjects + examplesProjects) {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion.set(JavaLanguageVersion.of(25))
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(GroovyCompile).configureEach {
        groovyOptions.forkOptions.jvmArgs.add('-Dgroovy.parameters=true')
    }
}

subprojects {
    plugins.withId('com.vanniktech.maven.publish') {
        mavenPublishing {
            publishToMavenCentral(true)
            signAllPublications()

            pom {
                name = 'Gru'
                description = 'HTTP Testing Framework'
                inceptionYear = '2018'
                url = "https://github.com/${slug}"
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'musketyr'
                        name = 'Vladimir Orany'
                        url = 'https://github.com/musketyr/'
                    }
                }
                scm {
                    url = "https://github.com/${slug}.git"
                    connection = "scm:git:git://github.com/${slug}.git"
                    developerConnection = "scm:git:ssh://git@github.com/${slug}.git"
                }
            }
        }

        signing {
            useInMemoryPgpKeys(rootProject.ext.signingInMemoryKey, rootProject.ext.signingInMemoryKeyPassword)
            sign publishing.publications
        }
    }
}

configure(libsProjects) {
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    plugins.withId('java') {
        processResources {
            filesMatching('**/org.codehaus.groovy.runtime.ExtensionModule') {
                filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [VERSION: version])
            }
        }

        jar {
            manifest.attributes provider: 'gradle'
        }

        dependencies {
            testImplementation "org.spockframework:spock-core:$spockVersion"
        }
    }
}

configure(kotlinLibsProjects) {
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    plugins.withId('java') {
        jar {
            manifest.attributes provider: 'gradle'
        }
    }
}

configure(platformsProjects) {
    plugins.withId('java-platform') {
        publishing {
            publications {
                main(MavenPublication) {
                    pom {
                        properties = [
                            'gru.version': version,
                        ]
                    }
                }
            }
        }
    }
}

// Wire the gru-bom platform once every published library has been included via settings.gradle.
gradle.projectsEvaluated {
    def bom = rootProject.findProject(':gru-bom')
    if (bom != null) {
        bom.dependencies.constraints {
            (libsProjects + kotlinLibsProjects).each { Project lib ->
                api lib
            }
        }
    }
}
