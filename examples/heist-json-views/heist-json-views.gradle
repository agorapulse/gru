buildscript {
    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "org.apache.grails:grails-gradle-plugins:$grailsGradlePluginVersion"
    }
}

version "0.1"
group "heist.json.views"

apply plugin: "groovy"
apply plugin: "eclipse"
apply plugin: "idea"
apply plugin: "war"
apply plugin: "org.apache.grails.gradle.grails-web"

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("org.apache.grails:grails-bom:$grailsVersion")

    implementation "org.apache.grails:grails-dependencies-starter-web"
    implementation "org.apache.grails:grails-data-hibernate5-spring-boot"
    implementation "org.apache.grails:grails-views-gson"

    runtimeOnly "com.h2database:h2"

    testImplementation "org.apache.grails:grails-dependencies-test"
    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.apache.grails:grails-views-gson"
    testImplementation "org.jsoup:jsoup:$jsoupVersion"
    testImplementation "org.xmlunit:xmlunit-core:$xmlUnitVersion"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation project(':gru-grails')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
