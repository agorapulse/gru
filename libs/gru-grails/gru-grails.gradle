dependencies {
    api project(':gru')

    // Apache Grails 7.1.1 still ships against Groovy 4.0.31; consumers bring
    // their own Groovy at runtime via Grails.
    compileOnly "org.apache.groovy:groovy:$apacheGroovyVersion"

    compileOnly "org.apache.grails:grails-core:$apacheGrailsVersion"
    compileOnly "org.apache.grails:grails-controllers:$apacheGrailsVersion"
    compileOnly "org.apache.grails:grails-url-mappings:$apacheGrailsVersion"
    compileOnly "org.apache.grails:grails-interceptors:$apacheGrailsVersion"
    compileOnly "org.apache.grails:grails-spring:$apacheGrailsVersion"
    compileOnly "org.apache.grails:grails-testing-support-web:$apacheGrailsVersion"
    compileOnly "org.apache.grails.testing:grails-test-core:$apacheGrailsVersion"
    compileOnly "org.apache.grails.web:grails-web-common:$apacheGrailsVersion"
    compileOnly "org.apache.grails.web:grails-web-mvc:$apacheGrailsVersion"
    compileOnly "org.apache.grails.web:grails-web-url-mappings:$apacheGrailsVersion"
    compileOnly "org.apache.grails:grails-views-gson:$apacheGrailsVersion"
    compileOnly "org.springframework:spring-webmvc:$springVersion"
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // optional: keep the json-views integration available; consumers wire it via Grails
    compileOnly "org.apache.grails:grails-views-gson:$apacheGrailsVersion"
}
