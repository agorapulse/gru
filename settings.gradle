pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://agorapulse.jfrog.io/agorapulse/gradle-plugins-releases-local/' }
        mavenCentral()
    }
}

plugins {
    id 'com.agorapulse.gradle.settings'                 version "${agorapulseGradlePluginsVersion}"
    id 'com.agorapulse.gradle.gradle-enterprise'        version "${agorapulseGradlePluginsVersion}"
    id 'com.agorapulse.gradle.remote-cache'             version "${agorapulseGradlePluginsVersion}"
    id 'com.agorapulse.gradle.internal-version-catalog' version "${agorapulseGradlePluginsVersion}"
}

rootProject.name = 'gru-root'

// Flat project naming (preserves :gru, :gru-bom, :gru-micronaut, ... references used across build scripts).
def modulePaths = [
    'docs/guide',
    'libs/gru',
    'libs/gru-okhttp',
    'libs/gru-api-gateway',
    'libs/gru-grails',
    'libs/gru-micronaut',
    'libs/gru-spring',
    'libs/gru-spring-integration-testing',
    'examples/heist',
    'examples/heist-json-views',
    'examples/heist-spring-boot',
    'examples/heist-micronaut',
    'platforms/gru-bom',
    'kotlin-libs/gru-kotlin',
]
modulePaths.each { String path ->
    String name = path.tokenize('/').last()
    include ":$name"
    project(":$name").projectDir = file(path)
}
